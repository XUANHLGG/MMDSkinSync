pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        // Architectury Loom itself still resolves Forge tooling artifacts even
        // though this Minecraft 1.21.4 build only publishes Fabric.
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mmdsync'

include("common")
include("fabric")
