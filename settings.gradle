rootProject.name = 'mmdsync-aggregate'

/*
 * Architectury 3.4 applies Gradle's IDEA plugin. Gradle 8.11 cannot configure
 * both byte-frozen builds at once because their internal project names match.
 * Select the one addressed by a single-version aggregate/direct task; buildAll
 * deliberately starts both independent wrappers from the aggregate script.
 */
def requestedTasks = gradle.startParameter.taskNames.collect { task ->
    task.toLowerCase(java.util.Locale.ROOT)
}
def direct1211 = requestedTasks.any { it.startsWith(':mc1211:') }
def direct1214 = requestedTasks.any { it.startsWith(':mc1214:') }
def aggregate1211 = requestedTasks.any { task ->
    ['build1211', 'compile1211', 'clean1211'].contains(task.tokenize(':').last())
}
def aggregate1214 = requestedTasks.any { task ->
    ['build1214', 'compile1214', 'clean1214'].contains(task.tokenize(':').last())
}

if (direct1211 && direct1214) {
    throw new GradleException('Architectury 3.4 prevents loading mc1211 and mc1214 together; use buildAll or separate commands.')
}

if ((direct1211 || aggregate1211) && !(direct1214 || aggregate1214)) {
    includeBuild('versions/1.21.1') {
        name = 'mc1211'
    }
    gradle.ext.activeVersionBuild = 'mc1211'
} else if ((direct1214 || aggregate1214) && !(direct1211 || aggregate1211)) {
    includeBuild('versions/1.21.4') {
        name = 'mc1214'
    }
    gradle.ext.activeVersionBuild = 'mc1214'
}
